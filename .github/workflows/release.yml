name: macOS ZIP prerelease

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Apple toolchain
        run: make doctor
      - name: Build
        run: make build
      - name: Run automated tests
        run: make test
      - name: Build and validate release ZIP
        run: make DIST_DIR=dist release
      - name: Confirm tag matches app version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          test "$RELEASE_TAG" = "v$VERSION"
      - name: Upload ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: AudioBridge-${{ github.ref_name }}-macOS
          path: |
            dist/AudioBridge-macOS.zip
            dist/AudioBridge-macOS.zip.sha256
          if-no-files-found: error
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/AudioBridge-macOS.zip dist/AudioBridge-macOS.zip.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" dist/AudioBridge-macOS.zip dist/AudioBridge-macOS.zip.sha256 --verify-tag --prerelease --generate-notes
          fi
