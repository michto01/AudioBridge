name: macOS ZIP artifact

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Apple toolchain
        run: make doctor
      - name: Build
        run: make build
      - name: Run automated tests
        run: make test
      - name: Build and validate release ZIP
        run: make DIST_DIR=dist release
      - name: Confirm tag matches app version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          test "$RELEASE_TAG" = "v$VERSION"
      - name: Upload ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: AudioBridge-${{ github.ref_name }}-macOS
          path: |
            dist/AudioBridge-macOS.zip
            dist/AudioBridge-macOS.zip.sha256
          if-no-files-found: error
